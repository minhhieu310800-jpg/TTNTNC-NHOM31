# Cấp 8 – AlphaZero-inspired, giai đoạn 2: chạy tiếp từ vòng 7 đến vòng 16.
# Vòng 1–6 dùng configs/alphazero.yaml (100 ván/vòng, 2 epoch). Sau 6 vòng policy_loss ~4,59,
# value_loss ~0,74: mỗi vòng chỉ ~100–150 bước cập nhật nên mạng học chậm.
# Giai đoạn này tăng số ván và số epoch mỗi vòng (vẫn trong khoảng proposal mục 5).
#
# Phải dùng CÙNG out_dir với giai đoạn 1 để chạy tiếp (state.json, best.pt, buffer):
# Colab: python -m training.alphazero configs/alphazero_v2.yaml --device cuda \
#            --out-dir /content/drive/MyDrive/caro/alphazero --max-hours 3
# Mac:   python -m training.alphazero configs/alphazero_v2.yaml --workers 6
name: az_v1
out_dir: checkpoints/alphazero
seed: 2026
device: auto
rounds: 16                           # tổng số vòng (6 vòng đã chạy + 10 vòng mới)

network:                             # GIỮ NGUYÊN như giai đoạn 1, nếu đổi sẽ không nạp được checkpoint
  blocks: 4
  channels: 64

selfplay:
  games_per_round: 200               # trước: 100 (proposal 100–200)
  chunk_games: 20
  workers: 1
  simulations: 100
  c_puct: 1.5
  dirichlet_alpha: 0.15
  dirichlet_eps: 0.25
  temp_moves: 10

buffer_rounds: 4

train:
  epochs: 10                         # trước: 2
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001

gating:
  games: 40
  simulations: 100
  threshold: 0.55
  openings_file: configs/openings.json
