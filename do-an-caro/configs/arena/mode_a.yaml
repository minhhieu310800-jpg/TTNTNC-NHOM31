# Chế độ A – ngân sách cố định (proposal mục 6): 0,5 s/nước, 1 luồng CPU mỗi tiến trình.
# Độ nhạy: sao chép file, đổi `name` và `budget` thành 0.1 hoặc 1.0.
# Giải đấu chính thức chạy ở issue #15, sau khi khóa engine (engine-v1.0).
# python -m arena.tournament configs/arena/mode_a.yaml
name: mode_a_0.5s
mode: A
budget: 0.5
size: 11
rule: vietnam
openings_file: configs/openings.json
num_openings: 100        # 100 khai cuộc x 2 lượt đổi bên = 200 ván/cặp
seeds: [0, 1, 2]         # cặp có Random/MCTS chạy 3 seed; cặp tất định chạy seed đầu
workers: 4               # không vượt quá số nhân CPU vật lý để đo thời gian chính xác

agents:
  random:
    type: random
  heuristic:
    type: heuristic
  alphabeta:
    type: alphabeta      # đào sâu lặp tới độ sâu 4 trong ngân sách
  mcts:
    type: mcts           # MCTS thuần: rollout ngẫu nhiên tới hết ván
  sl:                    # cấp 5: argmax policy, 1 lần suy luận (không dùng hết ngân sách)
    type: sl
    params: {checkpoint: checkpoints/level5/best.pt, device: cpu}
  rl:                    # cấp 6: RL self-play, argmax policy
    type: rl
    params: {checkpoint: checkpoints/level6/best.pt, device: cpu}
  puct:                  # cấp 7: PUCT + mạng cấp 5, chạy theo ngân sách thời gian
    type: puct
    params: {checkpoint: checkpoints/level5/best.pt, device: cpu}
  alphazero:             # cấp 8: PUCT + mạng AlphaZero-inspired (vòng 25)
    type: puct
    params: {checkpoint: checkpoints/alphazero2/best.pt, device: cpu}
