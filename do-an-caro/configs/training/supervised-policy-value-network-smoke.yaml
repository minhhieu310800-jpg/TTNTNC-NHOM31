# Cấu hình smoke test chạy nhanh (~2s) cho kiểm thử CI / pytest
name: "caro_supervised_policy_value_network_smoke"
data_path: "data/dataset_smoke.npz"
out_dir: "checkpoints/supervised-policy-value-network-smoke"

blocks: 1
channels: 8
board_size: 11

epochs: 2
batch_size: 4
lr: 0.01
weight_decay: 0.0001
value_weight: 1.0

augment: true
patience: 2
min_delta: 0.0001

device: "cpu"
seed: 42
num_workers: 0

